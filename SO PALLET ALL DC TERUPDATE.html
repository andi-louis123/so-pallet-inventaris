<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SO Pallet Inventaris Logistik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F7FAFC;
    --border:#E2E8F0;
    --text:#173049;
    --muted:#5E85A3;
    --amber:#4FA8E8;
    --amber-dim:#3A8FD1;
    --yolk:#6FBBF0;
    --yolk-deep:#2E86D6;
    --teal:#1D6FB8;
    --red:#D25353;
    --green:#1F9254;
    --green-bg:rgba(31,146,84,0.10);
    --green-border:rgba(31,146,84,0.28);
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:20px 18px 60px;}

  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 0 20px;border-bottom:1px solid var(--border);margin-bottom:22px;
    flex-wrap:wrap;gap:12px;
    position:sticky;top:0;z-index:50;
    background:var(--bg);
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .brand-mark{
    width:170px;height:170px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark img{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
  }
  h1{font-size:26px;letter-spacing:0.02em;margin:0;font-weight:700;}
  .subtitle{color:var(--muted);font-size:14px;margin-top:5px;font-family:var(--mono);letter-spacing:0.02em;}
  .clock{
    font-family:var(--mono);color:var(--muted);font-size:12px;text-align:right;
  }
  .clock strong{color:var(--teal);display:block;font-size:14px;}

  .main-tabs{
    display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;
  }
  .tab-btn{
    font-family:var(--sans);font-size:14px;font-weight:700;
    padding:10px 18px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);cursor:pointer;
    transition:all .15s;display:flex;align-items:center;gap:6px;
    box-shadow:0 1px 3px rgba(23,48,73,0.06);
  }
  .tab-btn:hover{border-color:var(--yolk-deep);color:var(--teal);}
  .tab-btn.active{
    background:linear-gradient(145deg, #CDEBFB, var(--yolk-deep));
    color:#0E3A5C;border-color:var(--yolk-deep);
    box-shadow:0 2px 8px rgba(46,134,214,0.3);
  }

  .crumbs{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:13px;margin-bottom:20px;color:var(--muted);font-family:var(--mono);
  }
  .crumbs .seg{cursor:pointer;padding:4px 2px;transition:color .15s;}
  .crumbs .seg:hover{color:var(--teal);}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface);
    border:1px solid var(--border);color:var(--teal);border-radius:9px;
    padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;
    font-family:var(--sans);margin-bottom:16px;transition:all .12s;
  }
  .back-btn:hover{background:var(--surface-2);border-color:var(--yolk-deep);transform:translateX(-2px);}
  .crumbs .seg.active{color:var(--text);font-weight:600;cursor:default;}
  .crumbs .sep{color:#3a4356;}

  .search-box{
    margin-bottom:18px;position:relative;
  }
  .search-box input{
    width:100%;padding:12px 14px 12px 40px;border-radius:10px;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    font-size:14px;font-family:var(--sans);outline:none;transition:border-color .15s;
  }
  .search-box input:focus{border-color:var(--amber);}
  .search-box::before{
    content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:17px;
  }

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(190px,1fr));gap:12px;
  }
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px 14px;cursor:pointer;transition:transform .12s, border-color .12s, background .12s, box-shadow .12s;
    position:relative;overflow:hidden;
    box-shadow:0 1px 3px rgba(23,48,73,0.06);
  }
  .card:hover{border-color:var(--amber-dim);background:var(--surface-2);transform:translateY(-2px);box-shadow:0 6px 16px rgba(23,48,73,0.10);}
  .card:active{transform:translateY(0);}
  .card .idx{
    font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.05em;
  }
  .card .name{
    font-size:14.5px;font-weight:600;margin-top:6px;line-height:1.3;
  }
  .card .badge{
    position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:10px;
    background:var(--green-bg);color:var(--green);padding:2px 7px;border-radius:20px;
    border:1px solid var(--green-border);font-weight:700;
  }
  .card .badge.empty{
    background:rgba(210,83,83,0.10);color:var(--red);border:1px solid rgba(210,83,83,0.28);
  }

  #dcGrid .card{background:#EAF4FD;}
  #dcGrid .card:hover{background:#DCEBFA;}

  .card.pallet{padding:40px 16px 18px;}
  .card.pallet .name{font-size:15px;}
  .card.pallet .dim{color:var(--muted);font-size:12px;margin-top:4px;font-family:var(--mono);}
  .card.pallet .thumb{
    width:100%;height:110px;border-radius:9px;overflow:hidden;margin-bottom:10px;
    background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
  }
  .card.pallet .thumb img{width:100%;height:100%;object-fit:contain;display:block;}

  .pallet-photo{
    border:1px solid var(--border);border-radius:14px;overflow:hidden;
    background:var(--surface);margin-bottom:20px;
    box-shadow:0 1px 4px rgba(23,48,73,0.06);
  }
  .pallet-photo .frame{
    width:100%;height:320px;display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);
  }
  .pallet-photo .frame img{
    max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;
  }
  .pallet-photo .cap{
    display:flex;align-items:center;gap:8px;padding:12px 16px;
    border-top:1px solid var(--border);font-size:13px;color:var(--muted);font-family:var(--mono);
  }
  .pallet-photo .cap strong{color:var(--text);font-family:var(--sans);}

  .section-title{
    font-size:13px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);
    margin:0 0 12px 2px;font-family:var(--mono);
  }

  .panel{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:22px;margin-bottom:20px;
    box-shadow:0 1px 4px rgba(23,48,73,0.06);
  }
  .panel-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .panel-head .icon{
    width:38px;height:38px;border-radius:9px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
    border:1px solid var(--border);overflow:hidden;
  }
  .panel-head .icon img{width:100%;height:100%;object-fit:contain;display:block;}
  .panel-head .t1{font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.06em;}
  .panel-head .t2{font-size:16px;font-weight:700;margin-top:2px;}

  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  @media (max-width:560px){.form-row{grid-template-columns:1fr;}}
  .field label{
    display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;
    font-family:var(--mono);letter-spacing:0.03em;text-transform:uppercase;
  }
  .field input, .field textarea{
    width:100%;padding:11px 13px;border-radius:9px;background:var(--surface-2);
    border:1px solid var(--border);color:var(--text);font-size:14.5px;font-family:var(--sans);
    outline:none;transition:border-color .15s;
  }
  .field input:focus, .field textarea:focus{border-color:var(--amber);}
  .field.full{grid-column:1 / -1;}

  .btn{
    border:none;border-radius:9px;padding:11px 20px;font-size:14px;font-weight:700;
    cursor:pointer;transition:filter .12s, transform .12s;font-family:var(--sans);
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.6;cursor:not-allowed;}
  .btn-primary{background:linear-gradient(145deg, #CDEBFB, var(--yolk-deep));color:#0E3A5C;box-shadow:0 2px 8px rgba(46,134,214,0.35);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn-ghost:hover{color:var(--text);border-color:var(--text);}

  .stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .stat{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:12px 16px;flex:1;min-width:130px;
    box-shadow:0 1px 3px rgba(23,48,73,0.06);
  }
  .stat .v{font-size:22px;font-weight:800;font-family:var(--mono);color:var(--teal);}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;
    color:var(--muted);letter-spacing:0.05em;padding:0 10px 10px;border-bottom:1px solid var(--border);
    font-weight:600;
  }
  tbody td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  .so-cell{font-family:var(--mono);font-weight:700;color:var(--teal);}
  .qty-cell{font-family:var(--mono);font-weight:700;}
  .time-cell{color:var(--muted);font-size:12px;font-family:var(--mono);}
  .del-btn{
    background:none;border:1px solid var(--border);color:var(--red);border-radius:7px;
    padding:5px 10px;font-size:12px;cursor:pointer;transition:all .12s;
  }
  .del-btn:hover{background:rgba(226,92,92,0.1);border-color:var(--red);}
  .del-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .empty-state{
    text-align:center;padding:36px 20px;color:var(--muted);font-size:13.5px;
  }
  .empty-state .glyph{font-size:28px;margin-bottom:8px;opacity:0.5;}

  .fallback-icon{font-size:36px;line-height:1;}

  ::selection{background:rgba(255,159,28,0.3);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  /* ===================== MONITOR DC (scoped, tema & variabel sendiri) ===================== */
  #monitorApp{
    --bg-0:#f4f7fa;
    --bg-1:#ffffff;
    --bg-2:#eef2f7;
    --line:#dbe4ec;
    --text-hi:#101820;
    --text-lo:#5c6b78;
    --mon-amber:#e8790a;
    --cyan:#0090a8;
    --mon-green:#0e9f5f;
    --mon-red:#e0273f;
    --font-display:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    background-color:var(--bg-0);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(0,144,168,0.07), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(232,121,10,0.07), transparent 45%);
    color:var(--text-hi);
    font-family:var(--font-display);
    border-radius:16px;
    padding:clamp(14px,2vw,24px);
  }
  #monitorApp .mon-wrap{max-width:1900px;margin:0 auto;}
  #monitorApp .mon-header{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;
    padding-bottom:clamp(12px,1.6vw,20px);border-bottom:1px solid var(--line);
    margin-bottom:clamp(14px,2vw,26px);
  }
  #monitorApp .mon-brand{display:flex;align-items:center;gap:14px;}
  #monitorApp .mon-brand .mark{
    width:clamp(38px,3.2vw,50px);height:clamp(38px,3.2vw,50px);border-radius:10px;
    background:linear-gradient(135deg,var(--cyan),var(--mon-amber));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-weight:700;color:#04070a;
    font-size:clamp(14px,1.2vw,18px);flex-shrink:0;
  }
  #monitorApp .mon-brand h2{font-size:clamp(15px,1.5vw,22px);font-weight:700;letter-spacing:.02em;}
  #monitorApp .mon-brand p{
    font-family:var(--font-mono);font-size:clamp(10px,.85vw,12px);color:var(--text-lo);
    letter-spacing:.04em;text-transform:uppercase;margin-top:2px;
  }
  #monitorApp .status-block{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);flex-wrap:wrap;}
  #monitorApp .status-pill{
    display:flex;align-items:center;gap:8px;background:var(--bg-2);
    border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 10px;
    font-family:var(--font-mono);font-size:clamp(10px,.85vw,12px);color:var(--text-lo);
  }
  #monitorApp .dot{width:8px;height:8px;border-radius:50%;background:var(--mon-green);box-shadow:0 0 8px var(--mon-green);}
  #monitorApp .dot.err{background:var(--mon-red);box-shadow:0 0 8px var(--mon-red);}
  #monitorApp .dot.loading{background:var(--mon-amber);box-shadow:0 0 8px var(--mon-amber);animation:mon-pulse 1s infinite;}
  @keyframes mon-pulse{0%,100%{opacity:1}50%{opacity:.3}}
  #monitorApp .mon-btn{
    font-family:var(--font-mono);font-size:clamp(10px,.85vw,12px);background:var(--bg-2);
    border:1px solid var(--line);color:var(--text-hi);padding:8px 14px;border-radius:8px;
    cursor:pointer;display:flex;align-items:center;gap:6px;transition:border-color .15s, color .15s;
  }
  #monitorApp .mon-btn:hover{border-color:var(--cyan);color:var(--cyan);}
  #monitorApp .refresh-track{width:64px;height:3px;background:var(--line);border-radius:3px;overflow:hidden;}
  #monitorApp .refresh-fill{height:100%;width:0%;background:var(--cyan);transition:width 1s linear;}

  #monitorApp .highlight-strip{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:clamp(10px,1.2vw,16px);margin-bottom:clamp(16px,2vw,28px);
  }
  #monitorApp .hl-card{
    background:linear-gradient(160deg,var(--bg-2),var(--bg-1));border:1px solid var(--line);
    border-left:3px solid var(--mon-amber);border-radius:12px;padding:clamp(12px,1.4vw,18px);
  }
  #monitorApp .hl-card .lbl{
    font-family:var(--font-mono);font-size:clamp(9px,.75vw,11px);letter-spacing:.08em;
    color:var(--text-lo);text-transform:uppercase;display:flex;justify-content:space-between;
  }
  #monitorApp .hl-card .num{
    font-family:var(--font-mono);font-weight:700;font-size:clamp(24px,2.6vw,38px);
    color:var(--mon-amber);margin-top:6px;
  }
  #monitorApp .hl-card .sub{font-size:clamp(11px,.9vw,13px);color:var(--text-hi);margin-top:2px;font-weight:600;}

  #monitorApp .mon-toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    margin-bottom:clamp(14px,1.6vw,20px);
  }
  #monitorApp .result-count{font-family:var(--font-mono);font-size:clamp(11px,.9vw,13px);color:var(--text-lo);letter-spacing:.02em;}
  #monitorApp .result-count strong{color:var(--text-hi);}
  #monitorApp .search-sort{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
  #monitorApp input#monSearch{
    background:var(--bg-1);border:1px solid var(--line);color:var(--text-hi);padding:8px 12px;
    border-radius:8px;font-family:var(--font-mono);font-size:clamp(11px,.9vw,13px);width:clamp(160px,16vw,240px);
  }
  #monitorApp input#monSearch::placeholder{color:var(--text-lo);}
  #monitorApp select#monSortMode{
    background:var(--bg-1);border:1px solid var(--line);color:var(--text-hi);padding:8px 10px;
    border-radius:8px;font-family:var(--font-mono);font-size:clamp(11px,.9vw,13px);
  }

  #monitorApp .mon-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(160px,14vw,220px),1fr));
    gap:clamp(10px,1.1vw,16px);
  }
  #monitorApp .mon-card{
    background:var(--bg-1);border:1px solid var(--line);border-radius:12px;
    padding:clamp(12px,1.2vw,18px);position:relative;overflow:hidden;
    transition:transform .15s, border-color .15s;
  }
  #monitorApp .mon-card:hover{transform:translateY(-2px);border-color:var(--cyan);}
  #monitorApp .mon-card .grp-tag{position:absolute;top:0;left:0;height:100%;width:3px;}
  #monitorApp .mon-card .name{
    font-size:clamp(11.5px,1vw,14px);font-weight:700;color:var(--text-hi);
    line-height:1.25;min-height:2.4em;margin-bottom:10px;
  }
  #monitorApp .mon-card .val{
    font-family:var(--font-mono);font-weight:700;font-size:clamp(22px,2.2vw,32px);
    color:var(--cyan);display:flex;align-items:baseline;gap:6px;
  }
  #monitorApp .mon-card .val span{font-size:clamp(9px,.7vw,11px);color:var(--text-lo);font-weight:500;font-family:var(--font-display);}
  #monitorApp .mon-card .bar-track{margin-top:10px;height:5px;background:var(--bg-2);border-radius:3px;overflow:hidden;}
  #monitorApp .mon-card .bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--mon-amber));width:0%;transition:width .8s ease;}
  #monitorApp .mon-card.zero .val{color:var(--text-lo);}
  #monitorApp .mon-card.zero .bar-fill{background:var(--line);}

  #monitorApp .empty-msg{
    grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-lo);
    font-family:var(--font-mono);font-size:13px;
  }
  #monitorApp .mon-footer{
    margin-top:clamp(20px,2.4vw,32px);padding-top:14px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
    color:var(--text-lo);font-family:var(--font-mono);font-size:clamp(9px,.8vw,11px);
  }

  #monitorApp.tv-mode .mon-btn span.label,
  #monitorApp.tv-mode .mon-toolbar{display:none;}
  #monitorApp.tv-mode .mon-wrap{max-width:100%;}
  #monitorApp.tv-mode .mon-grid{grid-template-columns:repeat(auto-fill,minmax(clamp(180px,15vw,240px),1fr));}
  #monitorApp.tv-mode{border-radius:0;height:100vh;overflow-y:auto;}

  #monitorApp ::-webkit-scrollbar{width:10px;height:10px;}
  #monitorApp ::-webkit-scrollbar-track{background:var(--bg-0);}
  #monitorApp ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark"><img src="https://i.supaimg.com/2c2fe634-0778-4567-93bf-17d826ecd3d2/bd41eff4-cff2-45b9-9689-472f68479192.png" alt="Logo"></div>
      <div>
        <h1>SO PALLET INVENTARIS LOGISTIK</h1>
        <div class="subtitle">Pencatatan &amp; Monitoring Serah Terima Pallet Antar DC</div>
      </div>
    </div>
    <div class="clock">
      <div id="syncBadge" style="font-family:var(--mono);font-size:10.5px;margin-bottom:4px;padding:2px 8px;border-radius:20px;display:inline-block;"></div>
      <strong id="clockTime">--:--:--</strong>
      <span id="clockDate">-</span>
    </div>
  </header>

  <div class="main-tabs" id="mainTabs">
    <button class="tab-btn active" data-page="home" onclick="goPage('home')">🏠 Beranda</button>
    <button class="tab-btn" data-page="monitor" onclick="goPage('monitor')">📊 Monitor DC</button>
  </div>

  <div class="crumbs" id="crumbs"></div>

  <div id="app"></div>

  <div id="monitorApp" style="display:none;">
    <div class="mon-wrap">
      <div class="mon-header">
        <div class="mon-brand">
          <div class="mark">SO</div>
          <div>
            <h2>Monitor Total Pallet per DC</h2>
            <p>NDC Jatake · Live dari Google Sheets</p>
          </div>
        </div>
        <div class="status-block">
          <div class="status-pill"><span class="dot loading" id="monStatusDot"></span><span id="monStatusText">Menghubungkan…</span></div>
          <div class="status-pill">
            <span class="refresh-track"><span class="refresh-fill" id="monRefreshFill"></span></span>

];

let STORE = {};
let nextId = 1;
let isSaving = false;
let state = { dc: null, pallet: null };
let currentPage = 'home';
let monitorInitialized = false;

/* ===================== HELPERS ===================== */
function keyOf(dc, pallet){ return dc + "||" + pallet; }
function fmtTime(d){
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'}) + ' ' +
         d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function fmtTglFromRaw(raw){
  if(!raw) return '';
  if(typeof raw === 'string' && /^\d{2}\s[A-Za-z]{3}\s\d{4}$/.test(raw)) return raw;
  const d = new Date(raw);
  if(isNaN(d.getTime())) return String(raw);
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== CLOCK ===================== */
function tickClock(){
  const now = new Date();
  document.getElementById('clockTime').textContent = now.toLocaleTimeString('id-ID');
  document.getElementById('clockDate').textContent = now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
tickClock(); setInterval(tickClock, 1000);

function updateSyncBadge(text, colorHex, bgAlpha){
  const syncBadge = document.getElementById('syncBadge');
  syncBadge.textContent = text;
  syncBadge.style.color = colorHex;
  syncBadge.style.background = bgAlpha;
}

const HAS_BACKEND = !!(CONFIG.APPS_SCRIPT_URL && CONFIG.APPS_SCRIPT_URL.startsWith('http'));
if(HAS_BACKEND){
  updateSyncBadge('● Menyambungkan...', '#96793F', 'rgba(150,110,20,0.08)');
} else {
  updateSyncBadge('○ Mode Lokal (URL belum diatur)', '#96793F', 'rgba(150,110,20,0.08)');
}

/* ===================== NAVIGASI MENU UTAMA ===================== */
function goPage(page){
  currentPage = page;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.page === page));
  document.getElementById('app').style.display = page === 'home' ? '' : 'none';
  document.getElementById('monitorApp').style.display = page === 'monitor' ? '' : 'none';
  renderCrumbs();
  if(page === 'home') render();
  if(page === 'monitor' && !monitorInitialized){
    monitorInitialized = true;
    fetchMonitorData();
    startMonitorCountdown();
  }
}

/* ===================== BREADCRUMB ===================== */
function renderCrumbs(){
  const c = document.getElementById('crumbs');
  if(currentPage !== 'home' || !state.dc){ c.innerHTML = ''; return; }
  let html = `<span class="seg" onclick="goHome()">🏠 Daftar DC</span>`;
  html += `<span class="sep">›</span><span class="seg ${state.pallet?'':'active'}" onclick="goDC('${escapeHtml(state.dc)}')">${escapeHtml(state.dc)}</span>`;
  if(state.pallet){
    html += `<span class="sep">›</span><span class="seg active">${escapeHtml(state.pallet)}</span>`;
  }
  c.innerHTML = html;
}

function goHome(){ state.dc=null; state.pallet=null; render(); }
function goDC(dc){ state.dc=dc; state.pallet=null; render(); }

/* ===================== VIEWS ===================== */
function viewDCList(){
  return `
    <div class="search-box">
      <input type="text" id="dcSearch" placeholder="Cari DC / Gudang..." oninput="filterDC(this.value)">
    </div>
    <div class="section-title">Pilih DC / Gudang (${DC_LIST.length})</div>
    <div class="grid" id="dcGrid">
      ${DC_LIST.map((dc,i)=>{
        const totalEntries = countEntriesForDC(dc);
        return `<div class="card" data-name="${escapeHtml(dc.toLowerCase())}" onclick="goDC('${escapeHtml(dc)}')">
          <div class="idx">DC-${String(i+1).padStart(2,'0')}</div>
          <div class="name">${escapeHtml(dc)}</div>
          ${totalEntries>0?`<div class="badge">${totalEntries} SO</div>`:'<div class="badge empty">Belum SO</div>'}
        </div>`;
      }).join('')}
    </div>
  `;
}

function countEntriesForDC(dc){
  let total = 0;
  PALLET_TYPES.forEach(p=>{
    const arr = STORE[keyOf(dc,p.name)];
    if(arr) total += arr.length;
  });
  return total;
}

function filterDC(q){
  q = q.toLowerCase().trim();
  document.querySelectorAll('#dcGrid .card').forEach(el=>{
    el.style.display = el.dataset.name.includes(q) ? '' : 'none';
  });
}

function viewPalletList(){
  return `
    <button class="back-btn" onclick="goHome()">← Kembali ke Daftar DC</button>
    <div class="section-title">Pilih Jenis Pallet — ${escapeHtml(state.dc)}</div>
    <div class="grid">
      ${PALLET_TYPES.map((p,i)=>{
        const arr = STORE[keyOf(state.dc,p.name)] || [];
        return `<div class="card pallet" onclick="goPallet('${escapeHtml(p.name)}')">
          <div class="thumb">${p.photo ? `<img src="${escapeHtml(p.photo)}" alt="${escapeHtml(p.name)}" loading="lazy">` : `<span class="fallback-icon">📦</span>`}</div>
          <div class="idx">0${i+1}</div>
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="dim">Ukuran: ${escapeHtml(p.dim)}</div>
          ${arr.length>0?`<div class="badge">${arr.length} SO</div>`:'<div class="badge empty">Belum SO</div>'}
        </div>`;
      }).join('')}
    </div>
  `;
}
function goPallet(name){ state.pallet = name; render(); }

/* ---- Bagian DINAMIS (stat + riwayat) dipisah dari form input ---- */
function statsHtml(k){
  const totalQty = (STORE[k]||[]).reduce((s,e)=>s+e.qty,0);
  return `
    <div class="stat"><div class="v" style="color:var(--green)">${(STORE[k]||[]).length}</div><div class="l">Total Entri SO</div></div>
    <div class="stat"><div class="v">${totalQty}</div><div class="l">Total Qty Pallet</div></div>
    <div class="stat"><div class="v">${escapeHtml(state.dc)}</div><div class="l">DC Tujuan/Asal</div></div>
  `;
}

function historyHtml(k){
  const entries = (STORE[k]||[]).slice().reverse();
  return `
    <div class="section-title">Riwayat Input (${entries.length})</div>
    <div class="panel" style="padding:0;overflow-x:auto;">
      ${entries.length === 0 ? `
        <div class="empty-state">
          <div class="glyph">📭</div>
          Belum ada data SO untuk pallet ini.
        </div>
      ` : `
        <table>
          <thead>
            <tr>
              <th>Tgl SO</th>
              <th>PIC SO</th>
              <th>Qty</th>
              <th>Waktu Input</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${entries.map(e=>`
              <tr>
                <td class="time-cell">${e.tgl ? escapeHtml(e.tgl) : '<span style="color:var(--muted)">—</span>'}</td>
                <td>${e.pic ? escapeHtml(e.pic) : '<span style="color:var(--muted)">—</span>'}</td>
                <td class="qty-cell">${e.qty}</td>
                <td class="time-cell">${fmtTime(new Date(e.ts))}</td>
                <td><button class="del-btn" onclick="deleteEntry('${e.id}')" ${e.deleting?'disabled':''}>${e.deleting?'...':'Hapus'}</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    </div>
  `;
}

/* Form dibangun SEKALI saat pindah ke halaman ini.
   Elemen #dynamicStats dan #dynamicHistory berisi bagian yang boleh
   diperbarui otomatis; kolom input (Tgl/PIC/Qty) TIDAK PERNAH dibongkar
   ulang oleh auto-refresh, sehingga tidak akan hilang saat sedang diketik. */
function viewInputForm(){
  const k = keyOf(state.dc, state.pallet);
  const palletInfo = PALLET_TYPES.find(p => p.name === state.pallet) || {};

  return `
    <button class="back-btn" onclick="goDC('${escapeHtml(state.dc)}')">← Kembali ke Jenis Pallet</button>

    <div class="pallet-photo">
      <div class="frame">${palletInfo.photo ? `<img src="${escapeHtml(palletInfo.photo)}" alt="${escapeHtml(state.pallet)}">` : `<span class="fallback-icon" style="font-size:64px;">📦</span>`}</div>
      <div class="cap">📷 Keterangan foto: <strong>${escapeHtml(state.pallet)}</strong></div>
    </div>

    <div class="stats" id="dynamicStats">${statsHtml(k)}</div>

    <div class="panel">
      <div class="panel-head">
        <div class="icon">${palletInfo.icon ? `<img src="${escapeHtml(palletInfo.icon)}" alt="${escapeHtml(state.pallet)}">` : '📦'}</div>
        <div>
          <div class="t1">Input Data</div>
          <div class="t2">${escapeHtml(state.pallet)}</div>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Tanggal SO</label>
          <input type="date" id="inpTgl">
        </div>
        <div class="field">
          <label>Nama PIC SO</label>
          <input type="text" id="inpPIC" placeholder="Nama PIC...">
        </div>
        <div class="field">
          <label>Jumlah Pallet</label>
          <input type="number" id="inpQty" placeholder="0" min="1">
        </div>
      </div>
      <button class="btn btn-primary" id="btnSimpan" onclick="submitEntry()">+ Simpan Data</button>
    </div>

    <div id="dynamicHistory">${historyHtml(k)}</div>
  `;
}

/* Perbarui HANYA statistik + riwayat, form input tidak disentuh sama sekali */
function refreshInputFormDynamic(){
  if(!state.dc || !state.pallet) return;
  const k = keyOf(state.dc, state.pallet);
  const statsEl = document.getElementById('dynamicStats');
  const histEl = document.getElementById('dynamicHistory');
  if(statsEl) statsEl.innerHTML = statsHtml(k);
  if(histEl) histEl.innerHTML = historyHtml(k);
}

function setSavingButtonState(saving){
  const btn = document.getElementById('btnSimpan');
  if(!btn) return;
  btn.disabled = saving;
  btn.textContent = saving ? 'Menyimpan...' : '+ Simpan Data';
}

async function submitEntry(){
  const tglInput = document.getElementById('inpTgl');
  const picInput = document.getElementById('inpPIC');
  const qtyInput = document.getElementById('inpQty');

  const tgl = tglInput.value;
  const pic = picInput.value.trim();
  const qty = parseInt(qtyInput.value, 10);

  if(!tgl){ alert('Tanggal SO wajib diisi.'); return; }
  if(!pic){ alert('Nama PIC SO wajib diisi.'); return; }
  if(!qty || qty <= 0){ alert('Jumlah pallet wajib diisi dan lebih dari 0.'); return; }

  const tglFmt = new Date(tgl+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
  const uid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);

  const k = keyOf(state.dc, state.pallet);
  if(!STORE[k]) STORE[k] = [];
  const localEntry = { id: 'e'+(nextId++), uid, tgl: tglFmt, pic, qty, ts: Date.now() };
  STORE[k].push(localEntry);

  isSaving = true;
  setSavingButtonState(true);
  refreshInputFormDynamic();

  if(HAS_BACKEND){
    try{
      const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'add',
          uid: uid,
          tanggal: tgl,
          pic: pic,
          dc: state.dc,
          palletType: state.pallet,
          qty: qty
        })
      });
      const result = await res.json();
      if(result.status !== 'success'){
        console.error('Apps Script menolak data:', result.message);
        alert('Gagal menyimpan ke Spreadsheet: ' + (result.message || 'tidak diketahui') + '\nData tetap tersimpan di tampilan lokal untuk sementara.');
      }
    }catch(err){
      console.error('Gagal sinkron ke Spreadsheet:', err);
      alert('Tidak bisa terhubung ke Spreadsheet. Data hanya tersimpan di tampilan lokal.');
    }
  }

  /* Kosongkan form HANYA setelah proses simpan selesai */
  if(tglInput) tglInput.value = '';
  if(picInput) picInput.value = '';
  if(qtyInput) qtyInput.value = '';

  isSaving = false;
  setSavingButtonState(false);
  refreshInputFormDynamic();
}

async function deleteEntry(id){
  const k = keyOf(state.dc, state.pallet);
  if(!STORE[k]) return;
  if(!confirm('Hapus data ini? Baris terkait di Spreadsheet juga akan dihapus.')) return;

  const entry = STORE[k].find(e => e.id === id);
  if(!entry) return;

  entry.deleting = true;
  refreshInputFormDynamic();

  if(entry.uid && HAS_BACKEND){
    try{
      const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', uid: entry.uid })
      });
      const result = await res.json();
      if(result.status !== 'success'){
        alert('Gagal menghapus di Spreadsheet: ' + (result.message || 'tidak diketahui') + '\nData tetap dihapus dari tampilan lokal.');
      }
    }catch(err){
      console.error('Gagal hapus di Spreadsheet:', err);
      alert('Tidak bisa terhubung ke Spreadsheet. Data hanya dihapus dari tampilan lokal.');
    }
  }

  STORE[k] = STORE[k].filter(e => e.id !== id);
  refreshInputFormDynamic();
}

/* ===================== LOAD DARI SPREADSHEET ===================== */
async function loadFromSheet(silent){
  if(!HAS_BACKEND) return;

  try{
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, { method: 'GET' });
    const result = await res.json();

    if(result.status === 'success'){
      const freshStore = {};
      let maxId = 0;

      (result.data || []).forEach(function(item){
        const k = keyOf(item.dc, item.palletType);
        if(!freshStore[k]) freshStore[k] = [];

        let ts = Date.now();
        if(item.timestamp){
          const parsed = new Date(item.timestamp);
          if(!isNaN(parsed.getTime())) ts = parsed.getTime();
        }

        maxId++;
        freshStore[k].push({
          id: 'e' + maxId,
          uid: item.uid,
          tgl: fmtTglFromRaw(item.tgl),
          pic: item.pic,
          qty: Number(item.qty) || 0,
          ts: ts
        });
      });

      STORE = freshStore;
      nextId = maxId + 1;

      updateSyncBadge('● Tersambung ke Spreadsheet', '#1D6FB8', 'rgba(29,111,184,0.1)');
    } else {
      console.error('Gagal memuat data:', result.message);
      updateSyncBadge('⚠ Gagal memuat data', '#D25353', 'rgba(226,92,92,0.1)');
    }
  }catch(err){
    console.error('Gagal memuat data dari Spreadsheet:', err);
    updateSyncBadge('⚠ Tidak terhubung', '#D25353', 'rgba(226,92,92,0.1)');
  } finally {
    if(currentPage === 'home'){
      /* PENTING: kalau user sedang di FORM INPUT (sudah pilih DC & jenis pallet),
         JANGAN bangun ulang seluruh halaman -- itu penyebab kolom yang sedang
         diketik hilang sendiri. Cukup perbarui statistik & riwayat saja. */
      if(state.dc && state.pallet){
        refreshInputFormDynamic();
      } else {
        render();
      }
    }
  }
}

/* ===================== ROOT RENDER ===================== */
function render(){
  renderCrumbs();
  const app = document.getElementById('app');

  /* Simpan teks pencarian DC yang sedang diketik, supaya tidak hilang
     kalau render() sempat dipanggil ulang saat sedang mengetik di pencarian. */
  const prevSearchEl = document.getElementById('dcSearch');
  const prevSearchVal = prevSearchEl ? prevSearchEl.value : '';
  const prevSearchFocused = prevSearchEl === document.activeElement;

  if(!state.dc){
    app.innerHTML = viewDCList();
    const newSearchEl = document.getElementById('dcSearch');
    if(newSearchEl && prevSearchVal){
      newSearchEl.value = prevSearchVal;
      filterDC(prevSearchVal);
      if(prevSearchFocused){
        newSearchEl.focus();
        newSearchEl.selectionStart = newSearchEl.selectionEnd = newSearchEl.value.length;
      }
    }
  } else if(!state.pallet){
    app.innerHTML = viewPalletList();
  } else {
    app.innerHTML = viewInputForm();
  }
}

/* ===================== MONITOR DC ===================== */
let monAllData = [];
let monRefreshTimer = null;
let monCountdown = MONITOR_CONFIG.REFRESH_SECONDS;

const monDotEl = document.getElementById('monStatusDot');
const monStatusTextEl = document.getElementById('monStatusText');
const monGridEl = document.getElementById('monGrid');
const monResultCountEl = document.getElementById('monResultCount');
const monHighlightEl = document.getElementById('monHighlightStrip');
const monLastUpdateEl = document.getElementById('monLastUpdate');
const monRefreshFillEl = document.getElementById('monRefreshFill');
const monRefreshLabelEl = document.getElementById('monRefreshLabel');
const monSearchEl = document.getElementById('monSearch');
const monSortModeEl = document.getElementById('monSortMode');

function fmtNum(n){ return n.toLocaleString('id-ID'); }

function renderMonitorHighlights(){
  const sorted = [...monAllData].sort((a,b)=>b.val-a.val);
  const top3 = sorted.slice(0,3);
  monHighlightEl.innerHTML = '';
  const labels = ['Tertinggi #1','Tertinggi #2','Tertinggi #3'];
  top3.forEach((item,i)=>{
    const div = document.createElement('div');
    div.className = 'hl-card';
    div.innerHTML = `
      <div class="lbl"><span>${labels[i]}</span><span>${item.groupName}</span></div>
      <div class="num">${fmtNum(item.val)}</div>
      <div class="sub">${item.name}</div>
    `;
    monHighlightEl.appendChild(div);
  });
}

function renderMonitorGrid(){
  let list = [...monAllData];

  const q = monSearchEl.value.trim().toLowerCase();
  if(q) list = list.filter(d => d.name.toLowerCase().includes(q));

  const mode = monSortModeEl.value;
  if(mode === 'desc') list.sort((a,b)=>b.val-a.val);
  else if(mode === 'asc') list.sort((a,b)=>a.val-b.val);
  else list.sort((a,b)=>a.name.localeCompare(b.name));

  monResultCountEl.innerHTML = `Menampilkan <strong>${list.length}</strong> dari <strong>${monAllData.length}</strong> DC`;

  monGridEl.innerHTML = '';
  if(list.length === 0){
    monGridEl.innerHTML = '<div class="empty-msg">Tidak ada DC yang cocok dengan pencarian.</div>';
    return;
  }

  const maxVal = Math.max(...monAllData.map(d=>d.val), 1);

  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'mon-card' + (item.val === 0 ? ' zero' : '');
    const pct = Math.max(2, Math.round((item.val / maxVal) * 100));
    card.innerHTML = `
      <div class="grp-tag" style="background:${item.color}"></div>
      <div class="name">${item.name}</div>
      <div class="val">${fmtNum(item.val)}<span>pallet</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${item.val===0?'#1e2b38':undefined}"></div></div>
    `;
    monGridEl.appendChild(card);
  });
}

function parseMonitorGviz(text){
  const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
  const data = JSON.parse(jsonStr);
  const rows = data.table.rows || [];
  const results = [];

  rows.forEach(row => {
    if(!row || !row.c) return;
    MONITOR_GROUPS.forEach(g => {
      const [nameIdx, valIdx] = g.colPair;
      const nameCell = row.c[nameIdx];
      const valCell = row.c[valIdx];
      const name = nameCell && nameCell.v !== null && nameCell.v !== undefined ? String(nameCell.v).trim() : '';
      const rawVal = valCell && valCell.v !== null && valCell.v !== undefined ? valCell.v : null;
      if(!name) return;
      if(name.toUpperCase() === 'DC') return;
      const val = Number(rawVal);
      if(isNaN(val)) return;
      results.push({ name, val, groupKey: g.key, groupName: g.name, color: g.color });
    });
  });
  return results;
}

async function fetchMonitorData(){
  monDotEl.className = 'dot loading';
  monStatusTextEl.textContent = 'Menyinkronkan…';
  try{
    const url = `https://docs.google.com/spreadsheets/d/${MONITOR_CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&gid=${MONITOR_CONFIG.GID}&t=${Date.now()}`;
    const res = await fetch(url, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const parsed = parseMonitorGviz(text);
    if(parsed.length === 0) throw new Error('Data kosong / format sheet berubah');
    monAllData = parsed;
    monDotEl.className = 'dot';
    monStatusTextEl.textContent = 'Live — tersambung';
    monLastUpdateEl.textContent = 'Terakhir sinkron: ' + new Date().toLocaleTimeString('id-ID');
    renderMonitorHighlights();
    renderMonitorGrid();
  }catch(err){
    monDotEl.className = 'dot err';
    monStatusTextEl.textContent = 'Gagal memuat data';
    console.error(err);
    if(monAllData.length === 0){
      monGridEl.innerHTML = `<div class="empty-msg">
        Tidak bisa mengambil data langsung dari Google Sheets.<br>
        Pastikan sheet dibagikan sebagai "Siapa saja yang memiliki link → Pembaca" lalu klik Refresh.<br>
        <span style="color:#ff5d6c">${err.message}</span>
      </div>`;
    }
  }
}

function startMonitorCountdown(){
  clearInterval(monRefreshTimer);
  monCountdown = MONITOR_CONFIG.REFRESH_SECONDS;
  monRefreshTimer = setInterval(()=>{
    monCountdown--;
    const pct = ((MONITOR_CONFIG.REFRESH_SECONDS - monCountdown) / MONITOR_CONFIG.REFRESH_SECONDS) * 100;
    monRefreshFillEl.style.width = pct + '%';
    monRefreshLabelEl.textContent = monCountdown + 's';
    if(monCountdown <= 0){
      fetchMonitorData();
      monCountdown = MONITOR_CONFIG.REFRESH_SECONDS;
    }
  }, 1000);
}

document.getElementById('monRefreshBtn').onclick = () => { fetchMonitorData(); monCountdown = MONITOR_CONFIG.REFRESH_SECONDS; };
document.getElementById('monFsBtn').onclick = () => {
  const monEl = document.getElementById('monitorApp');
  monEl.classList.toggle('tv-mode');
  if(!document.fullscreenElement){
    monEl.requestFullscreen?.().catch(()=>{});
  } else {
    document.exitFullscreen?.().catch(()=>{});
  }
};
monSearchEl.addEventListener('input', renderMonitorGrid);
monSortModeEl.addEventListener('change', renderMonitorGrid);

/* ===================== INISIALISASI ===================== */
goPage('home');
loadFromSheet();
setInterval(() => loadFromSheet(true), CONFIG.AUTO_REFRESH_MS);
</script>
