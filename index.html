<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SO Pallet Inventaris Logistik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F7FAFC;
    --border:#E2E8F0;
    --text:#173049;
    --muted:#5E85A3;
    --amber:#4FA8E8;
    --amber-dim:#3A8FD1;
    --yolk:#6FBBF0;
    --yolk-deep:#2E86D6;
    --teal:#1D6FB8;
    --red:#D25353;
    --green:#1F9254;
    --green-bg:rgba(31,146,84,0.10);
    --green-border:rgba(31,146,84,0.28);
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:20px 18px 60px;}

  /* Header & Posisi Akun Baru di Atas */
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 0 20px;border-bottom:1px solid var(--border);margin-bottom:22px;
    flex-wrap:wrap;gap:12px;
    position:sticky;top:0;z-index:50;
    background:var(--bg);
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .brand-mark{
    width:170px;height:170px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark img{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
  }
  h1{font-size:26px;letter-spacing:0.02em;margin:0;font-weight:700;}
  .subtitle{color:var(--muted);font-size:14px;margin-top:5px;font-family:var(--mono);letter-spacing:0.02em;}
  
  .header-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .clock{
    font-family:var(--mono);color:var(--muted);font-size:12px;text-align:right;
  }
  .clock strong{color:var(--teal);display:block;font-size:14px;}

  .session-pill-header{
    display:inline-flex;align-items:center;gap:6px;background:var(--green-bg);
    border:1px solid var(--green-border);color:var(--green);padding:4px 10px;
    border-radius:20px;font-size:11px;font-family:var(--mono);
  }
  .session-pill-header button{
    background:none;border:none;color:var(--red);cursor:pointer;font-family:var(--sans);
    font-size:10.5px;font-weight:700;margin-left:4px;padding:0;
  }

  .main-tabs{
    display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;
  }
  .tab-btn{
    font-family:var(--sans);font-size:14px;font-weight:700;
    padding:10px 18px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--muted);cursor:pointer;
    transition:all .15s;display:flex;align-items:center;gap:6px;
    box-shadow:0 1px 3px rgba(23,48,73,0.06);
  }
  .tab-btn:hover{border-color:var(--yolk-deep);color:var(--teal);}
  .tab-btn.active{
    background:linear-gradient(145deg, #CDEBFB, var(--yolk-deep));
    color:#0E3A5C;border-color:var(--yolk-deep);
    box-shadow:0 2px 8px rgba(46,134,214,0.3);
  }

  /* Breadcrumb */
  .crumbs{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:13px;margin-bottom:20px;color:var(--muted);font-family:var(--mono);
  }
  .crumbs .seg{cursor:pointer;padding:4px 2px;transition:color .15s;}
  .crumbs .seg:hover{color:var(--teal);}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface);
    border:1px solid var(--border);color:var(--teal);border-radius:99px;
    padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;
    font-family:var(--sans);margin-bottom:16px;transition:all .12s;
  }
  .back-btn:hover{background:var(--surface-2);border-color:var(--yolk-deep);transform:translateX(-2px);}
  .crumbs .seg.active{color:var(--text);font-weight:600;cursor:default;}
  .crumbs .sep{color:#3a4356;}

  /* Search */
  .search-box{
    margin-bottom:18px;position:relative;
  }
  .search-box input{
    width:100%;padding:12px 14px 12px 40px;border-radius:10px;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    font-size:14px;font-family:var(--sans);outline:none;transition:border-color .15s;
  }
  .search-box input:focus{border-color:var(--amber);}
  .search-box::before{
    content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:17px;
  }

  /* Grid of cards */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(190px,1fr));gap:12px;
  }
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px 14px;cursor:pointer;transition:transform .12s, border-color .12s, background .12s, box-shadow .12s;
    position:relative;overflow:hidden;
    box-shadow:0 1px 3px rgba(23,48,73,0.06);
  }
  .card:hover{border-color:var(--amber-dim);background:var(--surface-2);transform:translateY(-2px);box-shadow:0 6px 16px rgba(23,48,73,0.10);}
  .card:active{transform:translateY(0);}
  .card .idx{
    font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.05em;
  }
  .card .name{
    font-size:14.5px;font-weight:600;margin-top:6px;line-height:1.3;
  }
  .card .badge{
    font-family:var(--mono);font-size:10px;
    background:var(--green-bg);color:var(--green);padding:2px 7px;border-radius:20px;
    border:1px solid var(--green-border);font-weight:700;
  }
  .card .badge.empty{
    background:rgba(210,83,83,0.10);color:var(--red);border:1px solid rgba(210,83,83,0.28);
  }

  /* Posisi badge default untuk DC card */
  #dcGrid .card .badge {
    position:absolute;top:12px;right:12px;
  }

  #dcGrid .card{background:#EAF4FD;}
  #dcGrid .card:hover{background:#DCEBFA;}

  /* Kartu DC Custom & Tombol Hapus */
  .card.custom-dc{
    background:#FFF9E6 !important;
    border:1px dashed #F5A623 !important;
  }
  
  /* Ukuran Tombol & Teks Tambah DC Custom Diperkecil */
  .card.custom-card-add{
    border:2px dashed var(--teal);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:var(--teal);font-weight:600;font-size:12px;
    background:var(--surface-2);min-height:85px;padding:10px;gap:2px;
  }
  .card.custom-card-add:hover{background:#EAF4FD;}
  .card.custom-card-add .add-icon{font-size:16px;font-weight:800;}

  /* Tombol Hapus X berada di bawah badge SO */
  .custom-del-btn{
    position:absolute;top:38px;right:12px;background:rgba(210,83,83,0.1);
    border:1px solid rgba(210,83,83,0.3);color:var(--red);
    font-size:11px;font-family:var(--mono);font-weight:bold;
    cursor:pointer;padding:2px 6px;border-radius:6px;transition:all .12s;
  }
  .custom-del-btn:hover{
    background:var(--red);color:#fff;
  }

  /* Bingkai Pallet Persegi Membulat & Header Kartu */
  .card.pallet{padding:14px;display:flex;flex-direction:column;}
  .card-top-bar{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;
  }
  .card.pallet .name{font-size:14px;line-height:1.2;height:2.4em;overflow:hidden;}
  .card.pallet .dim{color:var(--muted);font-size:11px;margin-top:2px;font-family:var(--mono);}
  .card.pallet .thumb{
    width:100%;height:110px;border-radius:10px;overflow:hidden;margin-bottom:8px;
    background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
  }
  .card.pallet .thumb img{width:100%;height:100%;object-fit:contain;display:block;}

  /* Quick Counter Control */
  .card-counter{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);
  }
  .counter-btn{
    width:34px;height:34px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--teal);font-size:20px;font-weight:800;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:all .12s;user-select:none;
  }
  .counter-btn:hover{background:var(--yolk-deep);color:#fff;border-color:var(--yolk-deep);}
  .counter-btn:active{transform:scale(0.92);}
  .counter-val{
    font-family:var(--mono);font-weight:800;font-size:16px;color:var(--teal);
  }

  .pallet-photo{
    border:1px solid var(--border);border-radius:14px;overflow:hidden;
    background:var(--surface);margin-bottom:20px;
    box-shadow:0 1px 4px rgba(23,48,73,0.06);
  }
  .pallet-photo .frame{
    width:100%;height:320px;display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);
  }
  .pallet-photo .frame img{
    max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;
  }
  .pallet-photo .cap{
    display:flex;align-items:center;gap:8px;padding:12px 16px;
    border-top:1px solid var(--border);font-size:13px;color:var(--muted);font-family:var(--mono);
  }
  .pallet-photo .cap strong{color:var(--text);font-family:var(--sans);}

  .section-title{
    font-size:13px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);
    margin:0 0 12px 2px;font-family:var(--mono);
  }

  .panel{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:22px;margin-bottom:20px;
    box-shadow:0 1px 4px rgba(23,48,73,0.06);
  }
  .panel-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .panel-head .icon{
    width:38px;height:38px;border-radius:9px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
    border:1px solid var(--border);overflow:hidden;
  }
  .panel-head .icon img{width:100%;height:100%;object-fit:contain;display:block;}
  .panel-head .t1{font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.06em;}
  .panel-head .t2{font-size:16px;font-weight:700;margin-top:2px;}

  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  @media (max-width:560px){.form-row{grid-template-columns:1fr;}}
  .field label{
    display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;
    font-family:var(--mono);letter-spacing:0.03em;text-transform:uppercase;
  }
  .field input, .field textarea{
    width:100%;padding:11px 13px;border-radius:9px;background:var(--surface-2);
    border:1px solid var(--border);color:var(--text);font-size:14.5px;font-family:var(--sans);
    outline:none;transition:border-color .15s;
  }
  .field input:focus, .field textarea:focus{border-color:var(--amber);}

  .btn{
    border:none;border-radius:9px;padding:11px 20px;font-size:14px;font-weight:700;
    cursor:pointer;transition:filter .12s, transform .12s;font-family:var(--sans);
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.6;cursor:not-allowed;}
  .btn-primary{background:linear-gradient(145deg, #CDEBFB, var(--yolk-deep));color:#0E3A5C;box-shadow:0 2px 8px rgba(46,134,214,0.35);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn-ghost:hover{color:var(--text);border-color:var(--text);}

  /* Animasi Spinner Loading */
  .spinner {
    width: 18px;
    height: 18px;
    border: 3px solid rgba(14, 58, 92, 0.2);
    border-radius: 50%;
    border-top-color: #0E3A5C;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Notifikasi Sukses Modern (Toast / Banner) */
  .toast-success-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 25, 40, 0.4);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    animation: fadeIn 0.25s ease-out;
  }

  .toast-success-box {
    background: #ffffff;
    border: 1px solid var(--green-border);
    border-radius: 16px;
    padding: 24px 28px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(10, 25, 40, 0.2);
    animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .toast-icon-wrap {
    width: 60px;
    height: 60px;
    background: var(--green-bg);
    color: var(--green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin: 0 auto 14px;
    border: 2px solid var(--green-border);
  }

  .toast-success-box h3 {
    margin: 0 0 6px;
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
  }

  .toast-success-box p {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.4;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { transform: translateY(20px) scale(0.95); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .stat{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:12px 16px;flex:1;min-width:130px;
    box-shadow:0 1px 3px rgba(23,48,73,0.06);
  }
  .stat .v{font-size:22px;font-weight:800;font-family:var(--mono);color:var(--teal);}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;
    color:var(--muted);letter-spacing:0.05em;padding:0 10px 10px;border-bottom:1px solid var(--border);
    font-weight:600;
  }
  tbody td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .qty-cell{font-family:var(--mono);font-weight:700;}
  .time-cell{color:var(--muted);font-size:12px;font-family:var(--mono);}
  .del-btn{
    background:none;border:1px solid var(--border);color:var(--red);border-radius:7px;
    padding:5px 10px;font-size:12px;cursor:pointer;transition:all .12s;
  }
  .del-btn:hover{background:rgba(226,92,92,0.1);border-color:var(--red);}

  /* Modal Login & Custom DC */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,25,40,0.55);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;
  }
  .modal-box{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:26px 24px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(10,25,40,0.25);
    position:relative;
  }
  .modal-box h3{margin:0 0 4px;font-size:18px;}
  .modal-box .sub{color:var(--muted);font-size:13px;margin-bottom:18px;font-family:var(--mono);}
  .modal-box .field{margin-bottom:12px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .modal-error{
    background:rgba(210,83,83,0.10);border:1px solid rgba(210,83,83,0.28);color:var(--red);
    font-size:12.5px;padding:8px 12px;border-radius:8px;margin-bottom:12px;display:none;
  }
  .modal-close{
    position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);
    font-size:18px;cursor:pointer;
  }

  /* Counter Summary Panel */
  .summary-box{
    margin-top:20px;padding:18px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:12px;
  }
  .summary-list{
    margin:10px 0;padding:0;list-style:none;font-size:13px;font-family:var(--mono);
  }
  .summary-list li{
    display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border);
  }
  .summary-total{
    display:flex;justify-content:space-between;font-weight:800;font-size:16px;
    color:var(--teal);margin-top:10px;padding-top:8px;border-top:2px solid var(--border);
  }

  /* MONITOR DC (DASHBOARD) STYLES */
  #monitorApp{
    --bg-0:#f4f7fa;
    --bg-1:#ffffff;
    --bg-2:#eef2f7;
    --line:#dbe4ec;
    --text-hi:#101820;
    --text-lo:#5c6b78;
    --mon-amber:#e8790a;
    --cyan:#0090a8;
    --mon-green:#0e9f5f;
    --mon-red:#e0273f;
    --font-display:'IBM Plex Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    background-color:var(--bg-0);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(0,144,168,0.07), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(232,121,10,0.07), transparent 45%);
    color:var(--text-hi);
    font-family:var(--font-display);
    border-radius:16px;
    padding:clamp(14px,2vw,24px);
  }
  #monitorApp .mon-wrap{max-width:1900px;margin:0 auto;}
  #monitorApp .mon-header{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;
    padding-bottom:clamp(12px,1.6vw,20px);border-bottom:1px solid var(--line);
    margin-bottom:clamp(14px,2vw,26px);
  }
  #monitorApp .mon-brand{display:flex;align-items:center;gap:14px;}
  #monitorApp .mon-brand .mark{
    width:clamp(38px,3.2vw,50px);height:clamp(38px,3.2vw,50px);border-radius:10px;
    background:linear-gradient(135deg,var(--cyan),var(--mon-amber));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-weight:700;color:#04070a;
    font-size:clamp(14px,1.2vw,18px);flex-shrink:0;
  }
  #monitorApp .mon-brand h2{font-size:clamp(15px,1.5vw,22px);font-weight:700;letter-spacing:.02em;}
  #monitorApp .mon-brand p{
    font-family:var(--font-mono);font-size:clamp(10px,.85vw,12px);color:var(--text-lo);
    letter-spacing:.04em;text-transform:uppercase;margin-top:2px;
  }
  #monitorApp .status-block{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);flex-wrap:wrap;}
  #monitorApp .status-pill{
    display:flex;align-items:center;gap:8px;background:var(--bg-2);
    border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 10px;
    font-family:var(--font-mono);font-size:clamp(10px,.85vw,12px);color:var(--text-lo);
  }
  #monitorApp .dot{width:8px;height:8px;border-radius:50%;background:var(--mon-green);box-shadow:0 0 8px var(--mon-green);}
  #monitorApp .dot.err{background:var(--mon-red);box-shadow:0 0 8px var(--mon-red);}
  #monitorApp .dot.loading{background:var(--mon-amber);box-shadow:0 0 8px var(--mon-amber);animation:mon-pulse 1s infinite;}
  @keyframes mon-pulse{0%,100%{opacity:1}50%{opacity:.3}}
  #monitorApp .mon-btn{
    font-family:var(--font-mono);font-size:clamp(10px,.85vw,12px);background:var(--bg-2);
    border:1px solid var(--line);color:var(--text-hi);padding:8px 14px;border-radius:8px;
    cursor:pointer;display:flex;align-items:center;gap:6px;transition:border-color .15s, color .15s;
  }
  #monitorApp .mon-btn:hover{border-color:var(--cyan);color:var(--cyan);}
  #monitorApp .refresh-track{width:64px;height:3px;background:var(--line);border-radius:3px;overflow:hidden;}
  #monitorApp .refresh-fill{height:100%;width:0%;background:var(--cyan);transition:width 1s linear;}

  #monitorApp .highlight-strip{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:clamp(10px,1.2vw,16px);margin-bottom:clamp(16px,2vw,28px);
  }
  #monitorApp .hl-card{
    background:linear-gradient(160deg,var(--bg-2),var(--bg-1));border:1px solid var(--line);

function fmtTime(d){
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'}) + ' ' +
         d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function fmtTglFromRaw(raw){
  if(!raw) return '';
  if(typeof raw === 'string' && /^\d{2}\s[A-Za-z]{3}\s\d{4}$/.test(raw)) return raw;
  const d = new Date(raw);
  if(isNaN(d.getTime())) return String(raw);
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* LOGIN MODAL */
function openLoginModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'loginOverlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <button class="modal-close" onclick="closeLoginModal()">✕</button>
      <h3>🔒 Login Logistik</h3>
      <div class="sub">Masuk dengan akun terdaftar</div>
      <div class="modal-error" id="loginErrorBox"></div>
      <div class="field">
        <label>Email / Username</label>
        <input type="email" id="loginEmail" placeholder="nama@ndcjatake.com" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeLoginModal()">Batal</button>
        <button class="btn btn-primary" id="btnLoginSubmit" onclick="submitLogin()">Masuk</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  setTimeout(()=>{ const e=document.getElementById('loginEmail'); if(e) e.focus(); }, 50);
}

function closeLoginModal(){
  const overlay = document.getElementById('loginOverlay');
  if(overlay) overlay.remove();
  pendingDC = null;
}

function showLoginError(msg){
  const box = document.getElementById('loginErrorBox');
  if(!box) return;
  box.textContent = msg;
  box.style.display = 'block';
}

async function submitLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!email || !password){ showLoginError('Email dan password wajib diisi.'); return; }

  const btn = document.getElementById('btnLoginSubmit');
  btn.disabled = true; btn.textContent = 'Memeriksa...';

  if(!HAS_BACKEND){
    session = { loggedIn:true, email, username: email.split('@')[0], assignedDC: pendingDC };
    closeLoginModal();
    renderHeaderSession();
    if(pendingDC){ goDC(pendingDC); }
    return;
  }

  try{
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'login', email, password })
    });
    const result = await res.json();
    if(result.status === 'success'){
      session = { 
        loggedIn: true, 
        email, 
        username: result.username || email,
        assignedDC: result.assignedDC || null 
      };
      closeLoginModal();
      renderHeaderSession();
      
      if(session.assignedDC){
        goDC(session.assignedDC);
      } else if(pendingDC){
        goDC(pendingDC);
      } else {
        render();
      }
    } else {
      showLoginError(result.message || 'Email atau password salah.');
      btn.disabled = false; btn.textContent = 'Masuk';
    }
  }catch(err){
    showLoginError('Tidak dapat menyambung ke server.');
    btn.disabled = false; btn.textContent = 'Masuk';
  }
}

function logoutSession(){
  if(!confirm('Keluar dari sistem?')) return;
  session = { loggedIn:false, email:null, username:null, assignedDC:null };
  renderHeaderSession();
  goHome();
}

          <div class="idx">${isCustom ? 'CUSTOM' : 'DC-' + String(i+1).padStart(2,'0')}</div>
          <div class="name">${escapeHtml(dc)}</div>
          <div class="badge-container">${totalEntries>0?`<div class="badge">${totalEntries} SO</div>`:'<div class="badge empty">Belum SO</div>'}</div>
          ${isCustom ? `<button class="custom-del-btn" title="Hapus DC Custom" onclick="event.stopPropagation(); deleteCustomDC('${escapeHtml(dc)}')">✕ Hapus</button>` : ''}
        </div>`;
      }).join('')}
      <div class="card custom-card-add" onclick="openAddCustomDCPrompt()">
        <span class="add-icon">➕</span>
        <span>Tambah DC Custom</span>
      </div>
    </div>
  `;
}

function countEntriesForDC(dc){
  let total = 0;
  PALLET_TYPES.forEach(p=>{
    const arr = STORE[keyOf(dc,p.name)];
    if(arr) total += arr.length;
  });
  return total;
}

function filterDC(q){
  q = q.toLowerCase().trim();
  document.querySelectorAll('#dcGrid .card').forEach(el=>{
    if(!el.dataset.name) return;
    el.style.display = el.dataset.name.includes(q) ? '' : 'none';
  });
}

function updateDCBadgesOnly(){
  const cards = document.querySelectorAll('#dcGrid .card');
  if(!cards.length) return;

  allDC().forEach(dc => {
    const cardEl = Array.from(cards).find(c => c.dataset.name === dc.toLowerCase());
    if(cardEl){
      const badgeContainer = cardEl.querySelector('.badge-container');
      if(badgeContainer){
        const totalEntries = countEntriesForDC(dc);
        badgeContainer.innerHTML = totalEntries > 0 
          ? `<div class="badge">${totalEntries} SO</div>` 
          : `<div class="badge empty">Belum SO</div>`;
      }
    }
  });
}

function closeCustomDCModal(){
  const overlay = document.getElementById('customDCOverlay');
  if(overlay) overlay.remove();
}

function showCustomDCError(msg){
  const box = document.getElementById('customDCErrorBox');
  if(!box) return;
  box.textContent = msg;
  box.style.display = 'block';
}

function submitCustomDCForm(){
  const inputEl = document.getElementById('inpCustomDCName');
  if(!inputEl) return;
  const name = inputEl.value.trim();
  
  if(!name){
    showCustomDCError('Nama DC / Gudang wajib diisi.');
    return;
  }
  
  if(allDC().some(d => d.toLowerCase() === name.toLowerCase())){
    showCustomDCError('Nama DC / Gudang tersebut sudah ada.');
    return;
  }

  addCustomDC(name);
  closeCustomDCModal();
}

async function addCustomDC(name){
  CUSTOM_DC_LIST.push(name);
  render();
  if(HAS_BACKEND){
    try{
      await fetch(CONFIG.APPS_SCRIPT_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'addDC', name, addedBy: session.username || 'User' })
      });
    }catch(err){ console.error('Gagal simpan DC Custom:', err); }
  }
}

async function deleteCustomDC(name){
  if(!confirm(`Hapus DC Custom "${name}" dari daftar?`)) return;
  CUSTOM_DC_LIST = CUSTOM_DC_LIST.filter(d => d !== name);
  render();
  if(HAS_BACKEND){
    try{
      await fetch(CONFIG.APPS_SCRIPT_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'deleteDC', name })
      });
    }catch(err){ console.error('Gagal hapus DC Custom:', err); }
  }
}

    ${totalTempSO > 0 ? `
      <div class="summary-box">
        <strong style="font-size:15px;color:var(--teal)">📋 Hasil Penjumlahan Hitungan SO (Belum Disimpan):</strong>
        <ul class="summary-list">
          ${activePalletSummary.map(item => `
            <li>
              <span>${escapeHtml(item.name)}</span>
              <strong>${item.count} Pallet</strong>

function changeCounter(palletName, delta){
  if(!dcCounters[state.dc]) dcCounters[state.dc] = {};
  if(!dcCounters[state.dc][palletName]) dcCounters[state.dc][palletName] = 0;
  
  dcCounters[state.dc][palletName] += delta;
  if(dcCounters[state.dc][palletName] < 0) dcCounters[state.dc][palletName] = 0;
  
  render();
}

async function submitBatchPalletSO(){
  const currentCounters = dcCounters[state.dc] || {};
  const totalQty = Object.values(currentCounters).reduce((a,b)=>a+b, 0);

  if(totalQty <= 0){
    alert('Hitungan SO Pallet masih 0.');
    return;
  }

  const todayStr = new Date().toISOString().split('T')[0];
  const tglFmt = new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
  
  isSaving = true;
  render();

  for(const pName of Object.keys(currentCounters)){
    const qty = currentCounters[pName];
    if(qty > 0){
      const uid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      const k = keyOf(state.dc, pName);
      if(!STORE[k]) STORE[k] = [];
      
      STORE[k].push({
        id: 'e' + (nextId++),
        uid: uid,
        tgl: tglFmt,
        pic: session.username || 'Operator',
        qty: qty,
        ts: Date.now()
      });

      if(HAS_BACKEND){
        try{
          await fetch(CONFIG.APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'add',
              uid: uid,
              tanggal: todayStr,
              pic: session.username || 'Operator',
              dc: state.dc,
              palletType: pName,
              qty: qty
            })
          });
        }catch(e){
          console.error('Error sync:', e);
        }
      }
    }
  }

  showCoolSuccessToast(
    'Sinkronisasi Berhasil!',
    `Seluruh data hitungan SO Pallet (${totalQty} Pallet) untuk ${state.dc} berhasil tersimpan ke Spreadsheet secara realtime.`
  );

  dcCounters[state.dc] = {};
  isSaving = false;
  render();
}

async function submitEntry(){
  const tgl = document.getElementById('inpTgl').value;
  const pic = document.getElementById('inpPIC').value.trim();
  const qty = parseInt(document.getElementById('inpQty').value, 10);

  if(!tgl){ alert('Tanggal SO wajib diisi.'); return; }
  if(!pic){ alert('Nama PIC SO wajib diisi.'); return; }
  if(!qty || qty <= 0){ alert('Jumlah pallet wajib diisi.'); return; }

  const tglFmt = new Date(tgl+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
  const uid = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);

  const k = keyOf(state.dc, state.pallet);
  if(!STORE[k]) STORE[k] = [];
  STORE[k].push({ id: 'e'+(nextId++), uid, tgl: tglFmt, pic, qty, ts: Date.now() });

  isSaving = true;
  render();

  if(HAS_BACKEND){
    try{
      await fetch(CONFIG.APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'add', uid, tanggal: tgl, pic, dc: state.dc, palletType: state.pallet, qty })
      });
    }catch(err){ console.error(err); }
  }

  isSaving = false;
  render();
}

async function deleteEntry(id){
  const k = keyOf(state.dc, state.pallet);
  if(!STORE[k]) return;
  if(!confirm('Hapus data ini?')) return;

  const entry = STORE[k].find(e => e.id === id);
  if(!entry) return;

  if(entry.uid && HAS_BACKEND){
    try{
      await fetch(CONFIG.APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', uid: entry.uid })
      });
    }catch(err){ console.error(err); }
  }

  STORE[k] = STORE[k].filter(e => e.id !== id);
  render();
}

async function loadFromSheet(silent){
  if(!HAS_BACKEND) return;

  try{
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, { method: 'GET' });
    const result = await res.json();

    if(result.status === 'success'){
      const freshStore = {};
      let maxId = 0;

      (result.data || []).forEach(function(item){
        const k = keyOf(item.dc, item.palletType);
        if(!freshStore[k]) freshStore[k] = [];

        let ts = Date.now();
        if(item.timestamp){
          const parsed = new Date(item.timestamp);
          if(!isNaN(parsed.getTime())) ts = parsed.getTime();
        }

        maxId++;
        freshStore[k].push({
          id: 'e' + maxId,
          uid: item.uid,
          tgl: fmtTglFromRaw(item.tgl),
          pic: item.pic,
          qty: Number(item.qty) || 0,
          ts: ts
        });
      });

      STORE = freshStore;
      nextId = maxId + 1;

      if(Array.isArray(result.customDC)){
        CUSTOM_DC_LIST = result.customDC.filter(Boolean);
      }

      updateSyncBadge('● Tersambung ke Spreadsheet', '#1D6FB8', 'rgba(29,111,184,0.1)');
    }
  }catch(err){
    updateSyncBadge('⚠ Tidak terhubung', '#D25353', 'rgba(226,92,92,0.1)');
  } finally {
    if(!state.dc && !isSaving && currentPage === 'home'){
      const dcSearchInput = document.getElementById('dcSearch');
      if(dcSearchInput && (document.activeElement === dcSearchInput || dcSearchInput.value.trim() !== '')){
        updateDCBadgesOnly();
      } else {
        render();
      }
    }
  }
}

function render(){
  renderCrumbs();
  renderHeaderSession();
  const app = document.getElementById('app');
  if(!state.dc){
    app.innerHTML = viewDCList();
  } else if(!state.pallet){
    app.innerHTML = viewPalletList();
  } else {
    app.innerHTML = viewInputForm();
  }
}

/* LOGIKA MONITOR DC (DASHBOARD) */
let monAllData = [];
let monRefreshTimer = null;
let monCountdown = MONITOR_CONFIG.REFRESH_SECONDS;

const monDotEl = document.getElementById('monStatusDot');
const monStatusTextEl = document.getElementById('monStatusText');
const monGridEl = document.getElementById('monGrid');
const monResultCountEl = document.getElementById('monResultCount');
const monHighlightEl = document.getElementById('monHighlightStrip');
const monLastUpdateEl = document.getElementById('monLastUpdate');
const monRefreshFillEl = document.getElementById('monRefreshFill');
const monRefreshLabelEl = document.getElementById('monRefreshLabel');
const monSearchEl = document.getElementById('monSearch');
const monSortModeEl = document.getElementById('monSortMode');

function fmtNum(n){ return n.toLocaleString('id-ID'); }

function renderMonitorHighlights(){
  const sorted = [...monAllData].sort((a,b)=>b.val-a.val);
  const top3 = sorted.slice(0,3);
  monHighlightEl.innerHTML = '';
  const labels = ['Tertinggi #1','Tertinggi #2','Tertinggi #3'];
  top3.forEach((item,i)=>{
    const div = document.createElement('div');
    div.className = 'hl-card';
    div.innerHTML = `
      <div class="lbl"><span>${labels[i]}</span><span>${item.groupName}</span></div>
      <div class="num">${fmtNum(item.val)}</div>
      <div class="sub">${item.name}</div>
    `;
    monHighlightEl.appendChild(div);
  });
}

function renderMonitorGrid(){
  let list = [...monAllData];
  const q = monSearchEl.value.trim().toLowerCase();
  if(q) list = list.filter(d => d.name.toLowerCase().includes(q));

  const mode = monSortModeEl.value;
  if(mode === 'desc') list.sort((a,b)=>b.val-a.val);
  else if(mode === 'asc') list.sort((a,b)=>a.val-b.val);
  else list.sort((a,b)=>a.name.localeCompare(b.name));

  monResultCountEl.innerHTML = `Menampilkan <strong>${list.length}</strong> dari <strong>${monAllData.length}</strong> DC`;
  monGridEl.innerHTML = '';

  if(list.length === 0){
    monGridEl.innerHTML = '<div class="empty-msg">Tidak ada DC yang cocok.</div>';
    return;
  }

  const maxVal = Math.max(...monAllData.map(d=>d.val), 1);

  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'mon-card' + (item.val === 0 ? ' zero' : '');
    const pct = Math.max(2, Math.round((item.val / maxVal) * 100));
    card.innerHTML = `
      <div class="grp-tag" style="background:${item.color}"></div>
      <div class="name">${item.name}</div>
      <div class="val">${fmtNum(item.val)}<span>pallet</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${item.val===0?'#1e2b38':undefined}"></div></div>
    `;
    monGridEl.appendChild(card);
  });
}

function parseMonitorGviz(text){
  const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
  const data = JSON.parse(jsonStr);
  const rows = data.table.rows || [];
  const results = [];

  rows.forEach(row => {
    if(!row || !row.c) return;
    MONITOR_GROUPS.forEach(g => {
      const [nameIdx, valIdx] = g.colPair;
      const nameCell = row.c[nameIdx];
      const valCell = row.c[valIdx];
      const name = nameCell && nameCell.v !== null && nameCell.v !== undefined ? String(nameCell.v).trim() : '';
      const rawVal = valCell && valCell.v !== null && valCell.v !== undefined ? valCell.v : null;
      if(!name || name.toUpperCase() === 'DC') return;
      const val = Number(rawVal);
      if(isNaN(val)) return;
      results.push({ name, val, groupKey: g.key, groupName: g.name, color: g.color });
    });
  });
  return results;
}

async function fetchMonitorData(){
  monDotEl.className = 'dot loading';
  monStatusTextEl.textContent = 'Menyinkronkan…';
  try{
    const url = `https://docs.google.com/spreadsheets/d/${MONITOR_CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&gid=${MONITOR_CONFIG.GID}&t=${Date.now()}`;
    const res = await fetch(url, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const parsed = parseMonitorGviz(text);
    if(parsed.length === 0) throw new Error('Data kosong');
    monAllData = parsed;
    monDotEl.className = 'dot';
    monStatusTextEl.textContent = 'Live — tersambung';
    monLastUpdateEl.textContent = 'Terakhir sinkron: ' + new Date().toLocaleTimeString('id-ID');
    renderMonitorHighlights();
    renderMonitorGrid();
  }catch(err){
    monDotEl.className = 'dot err';
    monStatusTextEl.textContent = 'Gagal memuat data';
  }
}

function startMonitorCountdown(){
  clearInterval(monRefreshTimer);
  monCountdown = MONITOR_CONFIG.REFRESH_SECONDS;
  monRefreshTimer = setInterval(()=>{
    monCountdown--;
    const pct = ((MONITOR_CONFIG.REFRESH_SECONDS - monCountdown) / MONITOR_CONFIG.REFRESH_SECONDS) * 100;
    monRefreshFillEl.style.width = pct + '%';
    monRefreshLabelEl.textContent = monCountdown + 's';
    if(monCountdown <= 0){
      fetchMonitorData();
      monCountdown = MONITOR_CONFIG.REFRESH_SECONDS;
    }
  }, 1000);
}

document.getElementById('monRefreshBtn').onclick = () => { fetchMonitorData(); monCountdown = MONITOR_CONFIG.REFRESH_SECONDS; };
document.getElementById('monFsBtn').onclick = () => {
  const monEl = document.getElementById('monitorApp');
  monEl.classList.toggle('tv-mode');
  if(!document.fullscreenElement){ monEl.requestFullscreen?.().catch(()=>{}); } 
  else { document.exitFullscreen?.().catch(()=>{}); }
};
monSearchEl.addEventListener('input', renderMonitorGrid);
monSortModeEl.addEventListener('change', renderMonitorGrid);

goPage('home');
loadFromSheet();
setInterval(() => loadFromSheet(true), CONFIG.AUTO_REFRESH_MS);
</script>
